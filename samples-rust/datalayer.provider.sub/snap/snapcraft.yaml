name: sdk-rust-provider-sub
title: SDK Rust Provider Sub
version: '1.0.0'
summary: ctrlX Data Layer Provider Subscription (Rust)
description: |
  A ctrlX Data Layer provider subscription sample application written in Rust.
  Registers a wildcard folder node in the ctrlX Data Layer (provider) and
  subscribes to two integer nodes via the Data Layer client API (client).
  The client daemon is started after the provider daemon is ready.

base: core24
grade: stable
confinement: strict
type: app

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64]
    build-for: [arm64]

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT
donation: https://github.com/boschrexroth/ctrlx-automation-sdk
issues: https://github.com/boschrexroth/ctrlx-automation-sdk/issues
source-code: https://github.com/boschrexroth/ctrlx-automation-sdk
website: https://github.com/boschrexroth/ctrlx-automation-sdk

parts:
  datalayer-provider-sub:
    plugin: nil
    source: .
    build-packages:
      - clang
      #- libclang-dev
      - curl
      #- gcc
      - ctrlx-datalayer
    stage-packages:
      - ctrlx-datalayer
    build-environment:
      - RUST_CHANNEL: "1.95.0"
    override-build: |
      set -e

      # --- Install Rust toolchain ---
      if ! command -v rustup &> /dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain "${RUST_CHANNEL}"
        . "$HOME/.cargo/env"
      fi

      # --- Resolve crate symlink ---
      if [ -L "crate" ] && [ ! -e "crate" ]; then
        rm -f crate
      fi
      if [ ! -d "crate" ]; then
        SAMPLES_RUST="$(dirname "$(dirname "${CRAFT_PART_SRC}")")"
        if [ -d "${SAMPLES_RUST}/rust/crate" ]; then
          ln -sf "${SAMPLES_RUST}/rust/crate" crate
        fi
      fi

      # --- Build ---
      if [ "${CRAFT_ARCH_BUILD_FOR}" = "arm64" ]; then
        rustup target add aarch64-unknown-linux-gnu

        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
        export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig

        cargo build --release --target aarch64-unknown-linux-gnu
        install -Dm755 target/aarch64-unknown-linux-gnu/release/provider \
          "${CRAFT_PART_INSTALL}/bin/provider"
        install -Dm755 target/aarch64-unknown-linux-gnu/release/client \
          "${CRAFT_PART_INSTALL}/bin/client"
      else
        cargo build --release
        install -Dm755 target/release/provider \
          "${CRAFT_PART_INSTALL}/bin/provider"
        install -Dm755 target/release/client \
          "${CRAFT_PART_INSTALL}/bin/client"
      fi

# The provider daemon registers the Data Layer nodes and must be running
# before the client daemon subscribes to them.
apps:
  provider:
    command: bin/provider
    plugs:
      - network
      - datalayer
    daemon: simple
    restart-condition: always
    passthrough:
      restart-delay: 10s
    environment:
      #RUST_LOG: "error"
      RUST_LOG: "info"

  # The 'after' key tells snapd to start the client service only after
  # the provider service is active.
  client:
    command: bin/client
    plugs:
      - network
      - datalayer
    daemon: simple
    after:
      - provider
    restart-condition: always
    passthrough:
      restart-delay: 10s
    environment:
      #RUST_LOG: "error"
      RUST_LOG: "info"

plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer
