name: sdk-rust-provider-simple
title: SDK Rust Provider Simple
version: '1.0.0'
summary: ctrlX Data Layer Provider Simple (Rust)
description: |
  A simple ctrlX Data Layer provider sample application written in Rust.
  Registers int32, string, timestamp, and FlatBuffers nodes in the ctrlX Data Layer.

base: core24
grade: stable
confinement: strict
type: app

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [amd64]
    build-for: [arm64]

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT
donation: https://github.com/boschrexroth/ctrlx-automation-sdk
issues: https://github.com/boschrexroth/ctrlx-automation-sdk/issues
source-code: https://github.com/boschrexroth/ctrlx-automation-sdk
website: https://github.com/boschrexroth/ctrlx-automation-sdk

parts:
  datalayer-provider-simple:
    plugin: nil
    source: .
    build-packages:
      - clang
      #- libclang-dev
      - curl
      #- gcc
      - ctrlx-datalayer
    stage-packages:
      - ctrlx-datalayer
    build-environment:
      - RUST_CHANNEL: "1.95.0"
    override-build: |
      set -e

      # --- Install Rust toolchain ---
      if ! command -v rustup &> /dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain "${RUST_CHANNEL}"
        . "$HOME/.cargo/env"
      fi

      # --- Resolve crate symlink ---
      if [ -L "crate" ] && [ ! -e "crate" ]; then
        rm -f crate
      fi
      if [ ! -d "crate" ]; then
        SAMPLES_RUST="$(dirname "$(dirname "${CRAFT_PART_SRC}")")"
        if [ -d "${SAMPLES_RUST}/rust/crate" ]; then
          ln -sf "${SAMPLES_RUST}/rust/crate" crate
        fi
      fi

      # --- Build ---
      if [ "${CRAFT_ARCH_BUILD_FOR}" = "arm64" ]; then
        rustup target add aarch64-unknown-linux-gnu

        export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
        export PKG_CONFIG_SYSROOT_DIR=/usr/aarch64-linux-gnu
        export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig

        cargo build --release --target aarch64-unknown-linux-gnu
        install -Dm755 target/aarch64-unknown-linux-gnu/release/datalayer_provider_simple \
          "${CRAFT_PART_INSTALL}/bin/datalayer_provider_simple"
      else
        cargo build --release
        install -Dm755 target/release/datalayer_provider_simple \
          "${CRAFT_PART_INSTALL}/bin/datalayer_provider_simple"
      fi

      # --- Stage FlatBuffers binary schema ---
      install -Dm644 bfbs/sampleSchema.bfbs \
        "${CRAFT_PART_INSTALL}/bfbs/sampleSchema.bfbs"

apps:
  datalayer-provider-simple:
    command: bin/datalayer_provider_simple
    plugs:
      - network
      - datalayer
    daemon: simple
    restart-condition: always
    passthrough:
      restart-delay: 10s
    environment:
      RUST_LOG: "error"
      #RUST_LOG: "info"

plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer
