name: sdk-kotlin-provider-simple
title: SDK Kotlin Provider Simple
version: 1.0.0
summary: ctrlX Data Layer provider sample written in Kotlin for ctrlX OS.
description: This sample shows how to read/write data to the ctrlX Data Layer.
confinement: strict
grade: stable

contact: https://github.com/boschrexroth/ctrlx-automation-sdk
license: MIT
donation: https://github.com/boschrexroth/ctrlx-automation-sdk
issues: https://github.com/boschrexroth/ctrlx-automation-sdk/issues
source-code: https://github.com/boschrexroth/ctrlx-automation-sdk
website: https://github.com/boschrexroth/ctrlx-automation-sdk

base: core24
type: app

platforms:
  amd64:
  arm64:
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  provider:
    command: bin/run
    plugs:
      - network
      - network-bind
      - datalayer
    slots:
      - package-assets
      - package-run
    daemon: simple
    restart-condition: always
    passthrough:
      restart-delay: 10s

parts:
  provider:
    plugin: gradle
    source: .
    #gradle-parameters:
    #  - -Djavax.net.ssl.trustStore="/etc/ssl/certs/java/cacerts"    
    build-environment:
      - SNAP_BUILD_JAVA_VERSION: "21"
    build-packages:
      - openjdk-21-jdk-headless
    #  - http_proxy: "http://10.0.2.2:3128"
    #  - https_proxy: "http://10.0.2.2:3128"      
    stage-packages:
      - to amd64:
        - openjdk-21-jre-headless
      - to arm64:
        - openjdk-21-jre-headless:arm64

  wrapper-scripts:
    plugin: dump
    source: wrapper/
    organize:
      ./run.sh : bin/run

  bfbs:
    plugin: dump
    source: ./bfbs
    organize:
      sampleSchema.bfbs : bfbs/sampleSchema.bfbs      

  configs:
    source: ./configs
    plugin: dump
    organize:
      "package-assets/*": package-assets/${CRAFT_PROJECT_NAME}/
  
plugs:
  datalayer:
    interface: content
    content: datalayer
    target: $SNAP_DATA/.datalayer

slots:
  package-assets:
    interface: content
    content: package-assets
    source:
      read:
        - $SNAP/package-assets/${CRAFT_PROJECT_NAME}
  package-run:
    interface: content
    content: package-run
    source:
      write:
        - $SNAP_DATA/package-run/${CRAFT_PROJECT_NAME}

lint:
  ignore:
    - library:
        - usr/lib/aarch64-linux-gnu/libcomm_datalayer.so.*
        - usr/lib/x86_64-linux-gnu/libcomm_datalayer.so.*
